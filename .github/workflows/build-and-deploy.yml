# ---------------------------------------------------------------------------
# build-and-deploy
#
# CI/CD pipeline integrated with ServiceNow DevOps Change Velocity.
#
#   Build ──► Deploy TEST ──► Register Package ──► ServiceNow Change ──► Deploy PROD
#   (unit tests,  (change         (package of the      (Normal change +       (held by the
#    register      receipt +       registered artifact)  deployment gate)       ServiceNow deployment
#    artifact)     smoke tests)                                                 protection rule)
#
# ServiceNow DevOps rules this file follows (see docs/SETUP.md for sources):
#   - Workflow `name` must match the file name (build-and-deploy).
#   - Every job has a unique display `name`; each ServiceNow action's `job-name` must equal it.
#   - Jobs run sequentially: DevOps change automation is not supported for parallel jobs.
#   - Package registration runs in a job BEFORE the change job.
#   - setCloseCode / autoCloseChange are booleans, not strings.
#
# src/lib/pipeline.ts mirrors these jobs for the in-app walkthrough;
# test/pipeline.test.ts fails if the job keys or names drift.
# ---------------------------------------------------------------------------
name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: cancel superseded runs. main: queue deployments, never cancel one mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  APP_NAME: change-velocity-demo
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_PORT: '4321'
  # ServiceNow reporting is skipped on pull requests (fork PRs can't read secrets, and
  # PR runs would add noise to the pipeline/DORA data). CI still runs on every PR.
  SN_REPORT: ${{ github.event_name != 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: ServiceNow DevOps Unit Test Results
        # Only report when Vitest actually produced results (skips install/setup failures)
        if: always() && env.SN_REPORT == 'true' && hashFiles('test-results/unit/junit.xml') != ''
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: test-results/unit/junit.xml
          test-summary-name: 'Unit Tests - ${{ env.APP_VERSION }}'

      - name: Build site
        run: npm run build
        env:
          PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
          PUBLIC_GIT_SHA: ${{ github.sha }}
          PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: ServiceNow Register Artifact
        if: env.SN_REPORT == 'true'
        uses: ServiceNow/servicenow-devops-register-artifact@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          artifacts: '[{"name": "${{ env.APP_NAME }}", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'

  # -------------------------------------------------------------------------
  deploy-test:
    name: Deploy TEST
    needs: build
    # Deployments only run on main/dispatch; PRs stop after Build.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: dist

      # Change receipt: the step has Change receipt = true in ServiceNow, so the change is
      # created with pipeline data and the action returns after one poll (no approval).
      - name: ServiceNow Change Receipt
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy TEST'
          change-request: >-
            {
              "setCloseCode": true,
              "autoCloseChange": true,
              "attributes": {}
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      # Simulated deployment: serves dist/ on the runner. Replace with a real host
      # (S3, Azure Static Web Apps, Pages, etc.) for a customer pipeline.
      - name: Deploy to TEST
        run: bash scripts/deploy-local.sh dist "${APP_PORT}" test

      - name: Run smoke tests against TEST
        run: npm run test:smoke:ci
        env:
          BASE_URL: http://localhost:${{ env.APP_PORT }}
          EXPECTED_VERSION: ${{ env.APP_VERSION }}

      - name: ServiceNow DevOps Unit Test Results
        if: always() && hashFiles('test-results/smoke/junit.xml') != ''
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy TEST'
          xml-report-filename: test-results/smoke/junit.xml
          test-summary-name: 'Smoke Tests TEST - ${{ env.APP_VERSION }}'

      - name: Stop site
        if: always()
        run: bash scripts/stop-local.sh

  # -------------------------------------------------------------------------
  # Must be in a job before the change job so the package links to the
  # pipeline execution the change request is created for.
  register-package:
    name: Register Package
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ServiceNow Register Package
        uses: ServiceNow/servicenow-devops-register-package@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Register Package'
          artifacts: '[{"name": "${{ env.APP_NAME }}", "version": "${{ env.APP_VERSION }}", "semanticVersion": "${{ env.APP_VERSION }}", "repositoryName": "${{ github.repository }}"}]'
          package-name: '${{ env.APP_NAME }}-${{ env.APP_VERSION }}'

  # -------------------------------------------------------------------------
  # Creates a type-based (Normal) change. With deployment-gate set, this step
  # does not poll; the "production" environment's ServiceNow deployment
  # protection rule holds "Deploy PROD" until the change reaches Implement.
  # assignment_group is deliberately not sent: it would override the value set
  # on the pipeline step in ServiceNow.
  change:
    name: ServiceNow Change
    needs: register-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      change-request-number: ${{ steps.create.outputs.change-request-number }}
    steps:
      - name: ServiceNow Change
        id: create
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change'
          change-request: >-
            {
              "setCloseCode": true,
              "autoCloseChange": true,
              "attributes": {
                "type": "normal",
                "short_description": "Deploy ${{ env.APP_NAME }} ${{ env.APP_VERSION }} to production",
                "implementation_plan": "GitHub Actions job 'Deploy PROD' deploys the package after this change reaches Implement.",
                "backout_plan": "Re-run the workflow for the previous package version.",
                "test_plan": "Unit tests in Build, smoke tests in TEST and post-deploy verification in PROD."
              }
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true
          deployment-gate: '{"environment": "production", "jobName": "Deploy PROD"}'

  # -------------------------------------------------------------------------
  deploy-prod:
    name: Deploy PROD
    needs: change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}
          path: dist

      - name: Deploy to PROD
        run: bash scripts/deploy-local.sh dist "${APP_PORT}" prod

      - name: Post-deployment verification
        run: npm run test:smoke
        env:
          BASE_URL: http://localhost:${{ env.APP_PORT }}
          EXPECTED_VERSION: ${{ env.APP_VERSION }}

      - name: Stop site
        if: always()
        run: bash scripts/stop-local.sh

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### ${APP_NAME} ${APP_VERSION} → production"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Change request | ${{ needs.change.outputs.change-request-number }} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Package | ${APP_NAME}-${APP_VERSION} |"
            echo "| Job status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
