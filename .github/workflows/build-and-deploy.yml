# Build ──► ServiceNow Change ──► Deploy
#
# Unit tests run in Build and are reported to ServiceNow as a JUnit test summary,
# which shows on the change request for the run.
#
# Change gate (ServiceNow doc "GitHub Deployment Gates for ServiceNow DevOps Change"):
#   - "ServiceNow Change" creates the change request. Because `deployment-gate` is set,
#     the action doesn't wait for approval; it finishes once the change exists.
#   - "Deploy" runs in the `production` environment, whose deployment protection rule
#     is the ServiceNow GitHub App. GitHub holds the job until the change is approved
#     and moved to Implement in ServiceNow.
#
# ServiceNow requirements:
#   - Workflow `name` matches the file name (build-and-deploy).
#   - Each job has a unique display `name`; the action's `job-name` equals its job's name.
#   - Jobs run sequentially (change automation doesn't support parallel jobs).
#   - The change model is passed explicitly (chg_model). With the deployment gate, ServiceNow
#     rejected the change using only the model set on the pipeline step, because the type
#     compatibility property is off (ServiceNow doc "DevOps change models").
name: build-and-deploy

# Releases are cut by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
# Manual runs must also be started from a tag; runs from a branch skip every job.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release checks below

      # A release must be a newer version than every existing tag, and must point at a
      # commit that is already on main.
      - name: Check release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::Tag $TAG is not newer than the latest release $LATEST"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at a commit that is not on main"
            exit 1
          fi
          echo "Releasing $TAG (previous: ${LATEST:-none})"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm run test:ci

      # Runs even when tests fail, so failed results still reach ServiceNow.
      - name: ServiceNow DevOps Unit Test Results
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Build'
          xml-report-filename: test-results
          test-summary-name: 'Unit Tests - ${{ github.ref_name }}'

      - name: Build
        run: echo "Building ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"

  change:
    name: ServiceNow Change
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow Change'
          change-request: >-
            {
              "setCloseCode": true,
              "autoCloseChange": true,
              "attributes": {
                "chg_model": { "name": "DevOps Simplified" },
                "short_description": "Deploy ${{ github.repository }} ${{ github.ref_name }} to production"
              }
            }
          interval: '100'
          timeout: '3600'
          changeCreationTimeOut: '3600'
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true
          deployment-gate: '{"environment": "production", "jobName": "Deploy"}'

  deploy:
    name: Deploy
    needs: change
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy
        run: echo "Deploying ${GITHUB_REF_NAME} (${GITHUB_SHA::7}) to production"
